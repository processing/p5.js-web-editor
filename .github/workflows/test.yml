name: Test

on:
  pull_request:
  # Started by the release workflow on the cut release branch, since its PRs
  # are opened with GITHUB_TOKEN and don't trigger pull_request runs.
  workflow_dispatch:
  push:
    branches:
      - develop
      - release

jobs:
  test:
    name: Test and lint code base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '18.20.x'
      - run: npm install
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint

name: E2E Tests

on:
  pull_request:
    branches:
      - develop

jobs:
  e2e:
    name: End-to-end tests
    environment: e2e-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.x'
          cache: 'npm'

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: '6.0'

      - name: Create .env file
        run: cp .env.e2e .env

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start the app
        run: npm run start &

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8000 | grep -q "p5"; then
              echo "App fully ready"
              exit 0
            fi

            echo "Still bundling... $i/120"
            sleep 5
          done

          echo "App did not become ready"
          exit 1
      - name: Diagnose - check what browser actually sees after 60s
        run: |
          echo "=== Waiting 60 seconds ==="
          sleep 60
          
          echo "=== Raw server response (first 200 chars) ==="
          curl -s http://localhost:8000 | head -c 200
          
          echo ""
          echo "=== Does response contain CodeMirror? ==="
          curl -s http://localhost:8000 | grep -c "CodeMirror" || echo "NOT FOUND"
          
          echo "=== Does response contain p5? ==="
          curl -s http://localhost:8000 | grep -c "p5" || echo "NOT FOUND"
          
          echo "=== Does response contain app.js? ==="
          curl -s http://localhost:8000 | grep -c "app.js" || echo "NOT FOUND"
          
          echo "=== Node processes still running? ==="
          ps aux | grep node | grep -v grep
          
          echo "=== Port 8000 listening? ==="
          ss -tlnp | grep 8000 || echo "NOT LISTENING"
          
          echo "=== Port 8002 listening? ==="
          ss -tlnp | grep 8002 || echo "NOT LISTENING"

      - name: Run E2E tests
        run: npm run e2e:ci
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7


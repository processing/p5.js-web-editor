name: E2E Tests

on:
  pull_request:
    branches:
      - develop

jobs:
  e2e:
    name: End-to-end tests
    environment: e2e-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.x'
          cache: 'npm'

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: '6.0'

      - name: Create .env file
        run: cp .env.e2e .env

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start the app
        run: npm run start &

      - name: Disable eval devtool for CI
        run: |
          sed -i "s/devtool: 'eval-cheap-module-source-map'/devtool: false/" webpack/config.dev.js

      - name: Wait for webpack to finish compiling
        run: |
          echo "Waiting for webpack to finish..."
          for i in $(seq 1 120); do
            # Check if app.js is fully compiled by requesting it directly
            # webpack serves a loading response until compilation is done
            SIZE=$(curl -s http://localhost:8000/app.js | wc -c)
            echo "app.js size: $SIZE bytes (attempt $i/120)"
            if [ "$SIZE" -gt 1000000 ]; then
              echo "app.js fully compiled ($SIZE bytes) after $((i * 5))s"
              sleep 10
              exit 0
            fi
            sleep 5
          done
          echo "Webpack did not finish in time"
          exit 1

      - name: Run E2E tests
        run: npm run e2e:ci
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7


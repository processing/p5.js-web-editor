name: Update p5 hinter

# Keeps autocomplete and syntax highlighting in sync with the p5.js reference
# by regenerating client/utils/p5-hinter-v1.js and p5-hinter-v2.js.
on:
  # Mondays 15:30 UTC
  schedule:
    - cron: '30 15 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.repository == 'processing/p5.js-web-editor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18.20.x'
      - run: npm ci
      - run: npm run update-p5-hinter
      - name: Open pull request if the reference changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automated/update-p5-hinter
          base: develop
          add-paths: client/utils/p5-hinter-*.js
          commit-message: Update p5 hinter from the p5.js reference
          title: Update p5 hinter from the p5.js reference
          body: |
            Automated update from `npm run update-p5-hinter`, which regenerates the autocomplete and syntax highlighting keywords from the p5.js reference ([v1](https://v1.p5js.org/reference/data.json), [v2](https://p5js.org/reference/data.json)).

            Created by the [Update p5 hinter](../actions/workflows/update-p5-hinter.yml) workflow.
          delete-branch: true

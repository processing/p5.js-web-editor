version: "3.9"

services:
  mongo:
    image: mongo:8.0
    container_name: mongo
    volumes:
      - dbdata:/data/db
    ports:
      - "27017:27017"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      - MONGO_URL=mongodb://mongo:27017/p5js-web-editor
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "8000:8000"
      - "8002:8002"
    depends_on:
      - mongo

volumes:
  dbdata:
